<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Surf Forecast — 7-daags</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM (UMD globals: React, ReactDOM) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root{
      --accent:#a56cc1; --surf-red:#ff5a5f; --surf-orange:#ffb400; --surf-green:#4cc29f; --surf-darkgreen:#1f8f6b;
    }
    body{ font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; color:#000; background:#fff; }
    .h-scroll{ scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; cursor:grab; }
    .h-item{ scroll-snap-align:start; }
    .card{ border:1px solid rgba(15,23,42,.06); background:#fff; border-radius:12px; }
    .alert-badge{ width:18px; height:18px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:12px; }
    .q-red{ border-left:6px solid var(--surf-red) } .q-orange{ border-left:6px solid var(--surf-orange) }
    .q-green{ border-left:6px solid var(--surf-green) } .q-dark{ border-left:6px solid var(--surf-darkgreen) }
    .part-red{ background:rgba(255,90,95,.08); border-radius:8px } .part-orange{ background:rgba(255,180,0,.08); border-radius:8px }
    .part-green{ background:rgba(76,194,159,.08); border-radius:8px } .part-dark{ background:rgba(31,143,107,.08); border-radius:8px }
    .cursor-grabbing{ cursor:grabbing !important; cursor:-webkit-grabbing !important; }
  </style>
</head>
<body class="min-h-screen">
  <div class="p-6 max-w-7xl mx-auto">
    <!-- Dropdown menu surfspots -->
    <div class="relative inline-block text-left mb-6">
      <button id="dropdownButton" class="inline-flex justify-center w-full rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium hover:bg-gray-50">
        Kies surfspots
        <svg class="-mr-1 ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div id="dropdownMenu" class="hidden origin-top-right absolute mt-2 w-64 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-10 max-h-80 overflow-y-auto">
        <div class="p-2">
          <!-- Zoekbalk -->
          <input type="text" id="searchInput" placeholder="Zoek surfspot..." class="w-full border rounded-md p-2 mb-2 text-sm" />

          <!-- Alles uitvinken knop -->
          <button id="clearAll" class="w-full text-left text-xs text-red-500 mb-2 hover:underline">Alles uitvinken</button>

          <!-- Lijst met surfspots -->
          <div id="spotList" class="space-y-1 text-sm">
            <label class="flex items-center"><input type="checkbox" class="mr-2 spot" checked value="Scheveningen"> Scheveningen</label>
            <label class="flex items-center"><input type="checkbox" class="mr-2 spot" checked value="Wijk aan Zee"> Wijk aan Zee</label>
            <label class="flex items-center"><input type="checkbox" class="mr-2 spot" checked value="Domburg"> Domburg</label>
            <label class="flex items-center"><input type="checkbox" class="mr-2 spot" checked value="Texel"> Texel</label>
            <label class="flex items-center"><input type="checkbox" class="mr-2 spot" checked value="Zandvoort"> Zandvoort</label>
            <!-- Voeg hier jouw andere surfspots toe -->
          </div>
        </div>
      </div>
    </div>

    <!-- Hier draait jouw bestaande React-app -->
    <div id="app"></div>
  </div>

  <script>
    const dropdownButton = document.getElementById("dropdownButton");
    const dropdownMenu = document.getElementById("dropdownMenu");
    const searchInput = document.getElementById("searchInput");
    const clearAll = document.getElementById("clearAll");

    dropdownButton.addEventListener("click", () => {
      dropdownMenu.classList.toggle("hidden");
    });

    clearAll.addEventListener("click", () => {
      document.querySelectorAll(".spot").forEach(cb => cb.checked = false);
    });

    searchInput.addEventListener("input", (e) => {
      const filter = e.target.value.toLowerCase();
      document.querySelectorAll("#spotList label").forEach(label => {
        const text = label.textContent.toLowerCase();
        label.style.display = text.includes(filter) ? "" : "none";
      });
    });

    // Sluiten bij klik buiten dropdown
    document.addEventListener("click", (e) => {
      if (!dropdownButton.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add("hidden");
      }
    });
  </script>

  <!-- Jouw React-app (blijft onaangetast, inclusief Supabase) -->
  <script type="module" src="./react-app.js"></script>
</body>
</html>
