<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Surf Forecast — 7-daags</title>

  <!-- Tailwind CDN (play mode) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM UMD via unpkg -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Optional: Supabase JS client (commented out; uncomment and fill keys to use) -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script> -->

  <style>
    /* FONT: replace with hosted GT America files or import from your font host.
       Example:
       @font-face {
         font-family: 'GT America Standard';
         src: url('/fonts/GT-America-Standard.woff2') format('woff2');
         font-weight: 400 700;
         font-style: normal;
         font-display: swap;
       }
    */
    :root{
      --accent: #a56cc1;
      /* Surfline-like palette (approximate) */
      --surf-red: #ff5a5f;
      --surf-orange: #ffb400;
      --surf-green: #4cc29f;
      --surf-darkgreen: #1f8f6b;
      --muted: #f6f8fb;
    }
    body { font-family: "GT America Standard", Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; color: #000; background: #fff; }

    /* Horizontal scroll snapping row */
    .h-scroll {
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .h-item { scroll-snap-align: start; }

    /* subtle card border */
    .card { border: 1px solid rgba(15,23,42,0.06); background: white; border-radius: 12px; }

    /* small alert badge */
    .alert-badge {
      width: 18px; height: 18px; border-radius: 12px;
      display:inline-flex; align-items:center; justify-content:center;
      color: white; font-size:12px;
    }

    /* Part (ochtend/middag/avond) colored background + left border */
    .part-red { background: linear-gradient(180deg, rgba(255,90,95,0.06), transparent); border-left: 6px solid var(--surf-red); }
    .part-orange { background: linear-gradient(180deg, rgba(255,180,0,0.05), transparent); border-left: 6px solid var(--surf-orange); }
    .part-green { background: linear-gradient(180deg, rgba(76,194,159,0.05), transparent); border-left: 6px solid var(--surf-green); }
    .part-dark { background: linear-gradient(180deg, rgba(31,143,107,0.06), transparent); border-left: 6px solid var(--surf-darkgreen); }

    /* Day card: only left border colored (no background) */
    .day-border-red { border-left: 8px solid var(--surf-red); }
    .day-border-orange { border-left: 8px solid var(--surf-orange); }
    .day-border-green { border-left: 8px solid var(--surf-green); }
    .day-border-dark { border-left: 8px solid var(--surf-darkgreen); }

    /* small visual for swells in row (kept if wanted later) */
    .swell-line { height: 8px; border-radius: 6px; background: linear-gradient(180deg, #e8f2fb, white); }

    /* draggable cursor */
    .dragging { cursor: grabbing !important; cursor: -webkit-grabbing !important; }
    .draggable { cursor: grab; cursor: -webkit-grab; }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="p-6 max-w-7xl mx-auto"></div>

  <script type="text/javascript">
  const { useState, useEffect, useRef } = React;

  /**************
   * Helper data
   **************/
  const SPOTS = [
    { id: 'schev', name: 'Scheveningen', region: 'Z-H', lat: 52.1086, lon: 4.2878, shoreBearing: 260 },
    { id: 'wijk', name: 'Wijk aan Zee', region: 'N-H', lat: 52.4760, lon: 4.5490, shoreBearing: 250 },
    { id: 'domburg', name: 'Domburg', region: 'Zeeland', lat: 51.5083, lon: 3.5788, shoreBearing: 230 },
    { id: 'ijmuiden', name: 'IJmuiden', region: 'N-H', lat: 52.4586, lon: 4.6058, shoreBearing: 260 },
    { id: 'texel', name: 'Texel', region: 'Wadden', lat: 53.0412, lon: 4.7930, shoreBearing: 200 },
    { id: 'depanne', name: 'De Panne', region: 'BE', lat: 51.0679, lon: 2.5962, shoreBearing: 225 },
  ];

  const COMPASS_TO_DEG = {
    'N':0,'NNE':22.5,'NE':45,'ENE':67.5,'E':90,'ESE':112.5,'SE':135,'SSE':157.5,'S':180,'SSW':202.5,'SW':225,'WSW':247.5,'W':270,'WNW':292.5,'NW':315,'NNW':337.5,
    'NO':45,'O':90,'ZO':135,'Z':180,'ZW':225,'WZW':247.5,'WNW':292.5,'NW':315
  };

  /***********************
   * Utilities
   ***********************/
  function degDiff(a, b){
    let d = Math.abs(a - b) % 360;
    if (d > 180) d = 360 - d;
    return d;
  }

  function parseWindDirString(dirStr){
    if (!dirStr) return null;
    const token = dirStr.split(/[\/\s,]+/)[0].toUpperCase();
    if (COMPASS_TO_DEG[token] !== undefined) return COMPASS_TO_DEG[token];
    const letters = token.replace(/[^A-Z]/g,'');
    if (COMPASS_TO_DEG[letters] !== undefined) return COMPASS_TO_DEG[letters];
    return null;
  }

  function computeWindType(spot, windDirStr){
    const deg = parseWindDirString(windDirStr);
    if (deg === null) return 'unknown';
    const shore = spot.shoreBearing;
    const diff = degDiff(deg, shore);
    if (diff <= 45) return 'onshore';
    if (Math.abs(diff - 180) <= 45) return 'offshore';
    return 'crossshore';
  }

  function mapScoreToColorObj(score){
    if (score <= 0) return { key: 'red', classPart: 'part-red', classDay: 'day-border-red', color: 'var(--surf-red)' };
    if (score === 1) return { key: 'orange', classPart: 'part-orange', classDay: 'day-border-orange', color: 'var(--surf-orange)' };
    if (score === 2 || score === 3) return { key: 'green', classPart: 'part-green', classDay: 'day-border-green', color: 'var(--surf-green)' };
    return { key: 'dark', classPart: 'part-dark', classDay: 'day-border-dark', color: 'var(--surf-darkgreen)' };
  }

  // Beaufort -> km/h midpoint table (approx)
  const BFT_TO_KMH = [0,3,8.5,15.5,24,33.5,44,55.5,68,81.5,95.5,110,125];
  function bftToKmh(bft){
    if (bft == null || isNaN(bft)) return null;
    const idx = Math.max(0, Math.min(12, Math.round(Number(bft))));
    return Math.round(BFT_TO_KMH[idx]);
  }

  // Build conclusion
  function buildConclusion(entry){
    if (!entry) return '';
    const score = entry.score;
    const wt = entry.wind_type;
    if (score >= 4) return `Top-venster: sterke sets en gunstige wind — pak je korte board en ga vroeg of rond hoogwater.`;
    if (score === 3) return `Goede surfmomenten — vooral de beste dagdelen checken. Korte ritjes maar krachtig.`;
    if (score === 2) return `Prima voor longboard/fish; niet ideaal voor shortboarders. Kies rustige uren.`;
    if (score === 1) return `Klein en rommelig; goed voor beginners of lessen.`;
    return `Te klein of te rommelig; waarschijnlijk alleen geschikt voor lesjes/softtop.`;
  }

  // scoring
  function computeScore({swell_m, period_s, wind_bft, wind_type}){
    let score = 0;
    if (swell_m >= 1.2) score += 2;
    else if (swell_m >= 0.6) score += 1;
    if (period_s >= 9) score += 1;
    else if (period_s >= 7) score += 0.5;
    if (wind_type === 'offshore') score += 1;
    if (wind_type === 'crossshore') score += 0.5;
    if (wind_type === 'onshore' && wind_bft >= 4) score -= 1;
    score = Math.max(0, Math.min(4, Math.round(score)));
    return score;
  }

  /***********************
   * Mock data loader (replace with Supabase fetch)
   ***********************/
  function loadMockData(){
    const today = new Date();
    const days = [...Array(7)].map((_,i)=>{
      const d = new Date(today); d.setDate(today.getDate() + i);
      return d.toISOString().slice(0,10);
    });

    const data = {};
    SPOTS.forEach(spot=>{
      data[spot.id] = days.map((date, idx) => {
        const swell_m = [0.1,0.4,0.6,1.0,1.4,0.9,0.7][idx % 7];
        const period_s = [5,6,7,9,10,8,6][idx % 7];
        const wind_bft = [1,2,3,5,4,3,2][idx % 7];
        const wind_dir = ['ZW','ZW','W','WNW','NW','W','Z'][idx % 7];
        const parts = {
          morning: { swell_m: +(swell_m * 0.9).toFixed(2), period_s: Math.max(4,period_s-1), wind_bft: Math.max(0,wind_bft-1), wind_dir },
          midday:   { swell_m: +(swell_m).toFixed(2), period_s, wind_bft, wind_dir },
          evening:  { swell_m: +(swell_m * 1.05).toFixed(2), period_s: period_s+1, wind_bft: wind_bft+ (idx%2), wind_dir }
        };
        return { date, parts, spot: spot.id, summary: '', alert: (idx===3 && spot.id==='schev') };
      });
    });

    return data;
  }

  /***********************
   * Drag-to-scroll hook
   ***********************/
  function useDragScroll(ref){
    useEffect(()=>{
      const el = ref.current;
      if (!el) return;
      let isDown = false;
      let startX; let scrollLeft;

      function onMouseDown(e){
        isDown = true;
        el.classList.add('dragging');
        startX = e.pageX - el.offsetLeft;
        scrollLeft = el.scrollLeft;
        e.preventDefault();
      }
      function onMouseMove(e){
        if(!isDown) return;
        const x = e.pageX - el.offsetLeft;
        const walk = (x - startX) * 1.2; // scroll-fast
        el.scrollLeft = scrollLeft - walk;
      }
      function onUp(){
        isDown = false;
        el.classList.remove('dragging');
      }
      function onTouchStart(e){
        isDown = true;
        el.classList.add('dragging');
        startX = e.touches[0].pageX - el.offsetLeft;
        scrollLeft = el.scrollLeft;
      }
      function onTouchMove(e){
        if(!isDown) return;
        const x = e.touches[0].pageX - el.offsetLeft;
        const walk = (x - startX) * 1.2;
        el.scrollLeft = scrollLeft - walk;
      }
      function onTouchEnd(){ onUp(); }

      el.addEventListener('mousedown', onMouseDown);
      el.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onUp);

      el.addEventListener('touchstart', onTouchStart, {passive:true});
      el.addEventListener('touchmove', onTouchMove, {passive:true});
      el.addEventListener('touchend', onTouchEnd);

      return () => {
        el.removeEventListener('mousedown', onMouseDown);
        el.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onUp);
        el.removeEventListener('touchstart', onTouchStart);
        el.removeEventListener('touchmove', onTouchMove);
        el.removeEventListener('touchend', onTouchEnd);
      };
    }, [ref]);
  }

  /***********************
   * Main App
   ***********************/
  function App(){
    const [spots, setSpots] = useState(SPOTS);
    const [data, setData] = useState({});
    const [selectedSpots, setSelectedSpots] = useState(() => {
      try { return JSON.parse(localStorage.getItem('fav_spots') || '[]'); } catch(e){ return []; }
    });
    const [filterBest, setFilterBest] = useState(false);
    const [loading, setLoading] = useState(true);
    const containerRefs = useRef({}); // hold refs for each spot slider

    useEffect(() => {
      setLoading(true);
      const d = loadMockData();
      setTimeout(()=>{ setData(d); setLoading(false); }, 250);
    }, []);

    useEffect(()=>{ localStorage.setItem('fav_spots', JSON.stringify(selectedSpots)); }, [selectedSpots]);

    function toggleSpot(spotId){
      setSelectedSpots(prev => prev.includes(spotId) ? prev.filter(s=>s!==spotId) : [...prev, spotId]);
    }

    // compute part score and day composite score (average of parts)
    function computeDayAggregate(spotId, dayEntry){
      const ag = { date: dayEntry.date, spot: spotId, alert: !!dayEntry.alert, partsComputed: {} };
      const spot = spots.find(s=>s.id===spotId);
      const partKeys = ['morning','midday','evening'];
      let scores = [];
      partKeys.forEach(k => {
        const p = (dayEntry.parts && dayEntry.parts[k]) ? dayEntry.parts[k] : {};
        const wind_type = computeWindType(spot, p.wind_dir || null);
        const score = computeScore({swell_m: p.swell_m || 0, period_s: p.period_s || 0, wind_bft: p.wind_bft || 0, wind_type});
        ag.partsComputed[k] = { ...p, wind_type, score };
        scores.push(score);
      });
      // average score across parts (float), but map to integer for color mapping
      const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
      ag.score = avg;
      // overall aggregated numbers for summary display
      const swell_avg = Object.values(ag.partsComputed).reduce((s,p)=>s + (p.swell_m || 0),0)/3;
      const period_avg = Math.round(Object.values(ag.partsComputed).reduce((s,p)=>s + (p.period_s || 0),0)/3);
      const wind_bft_avg = Math.round(Object.values(ag.partsComputed).reduce((s,p)=>s + (p.wind_bft || 0),0)/3);
      const wind_dir = Object.values(ag.partsComputed)[1]?.wind_dir || Object.values(ag.partsComputed)[0]?.wind_dir;
      const wind_type = computeWindType(spot, wind_dir);
      ag.swell_m = +(swell_avg.toFixed(2));
      ag.period_s = period_avg;
      ag.wind_bft = wind_bft_avg;
      ag.wind_dir = wind_dir;
      ag.wind_type = wind_type;
      ag.summary = buildConclusion(ag);
      return ag;
    }

    function spotsToShow(){
      const all = selectedSpots.length ? spots.filter(s=>selectedSpots.includes(s.id)) : spots;
      if (!filterBest) return all;
      const today = new Date().toISOString().slice(0,10);
      let best = null; let bestScore = -1;
      all.forEach(sp => {
        const arr = data[sp.id] || [];
        const e = arr.find(x => x.date === today);
        if (!e) return;
        const ag = computeDayAggregate(sp.id, e);
        if (ag.score > bestScore){ bestScore = ag.score; best = sp; }
      });
      if (best) return [best, ...all.filter(s=>s.id !== best.id)];
      return all;
    }

    // assign refs
    useEffect(()=>{
      spotsToShow().forEach(sp => {
        if (!containerRefs.current[sp.id]) containerRefs.current[sp.id] = React.createRef();
      });
    });

    // apply drag hook on visible containers
    useEffect(()=>{
      Object.values(containerRefs.current).forEach(r => {
        if (r && r.current) useDragScroll(r); // note: hook expects a ref; called here imperatively per ref
      });
      // NOTE: above is fine for this small prototype. If you want optimization, refactor hook usage.
    }, [containerRefs, data, selectedSpots, filterBest]);

    // Render
    return React.createElement('div', { className: 'space-y-6' },
      React.createElement('header', { className: 'flex items-center justify-between' },
        React.createElement('div', { className: 'flex items-center gap-4' },
          React.createElement('div', { className: 'w-12 h-12 rounded flex items-center justify-center border', style: { background: 'linear-gradient(180deg, white, #faf5ff)' } },
            React.createElement('div', { style: { color: 'var(--accent)', fontWeight:700 } }, 'Logo')
          ),
          React.createElement('div', null,
            React.createElement('h1', { className: 'text-2xl font-medium' }, 'Surf Forecast'),
            React.createElement('div', { className: 'text-sm text-slate-600' }, 'AI gestuurde surfdata, recht op je beeldscherm!')
          )
        ),
        React.createElement('div', { className: 'flex items-center gap-3' },
          React.createElement('label', { className: 'text-sm text-slate-600 mr-2' }, 'Filter beste bovenaan'),
          React.createElement('input', { type: 'checkbox', checked: filterBest, onChange: e=>setFilterBest(e.target.checked) })
        )
      ),

      React.createElement('section', { className: 'card p-4' },
        React.createElement('div', { className: 'flex flex-wrap gap-3 items-center' },
          React.createElement('div', { className: 'text-sm text-slate-700 mr-2' }, 'Selecteer favoriete spots:'),
          spots.map(sp => React.createElement('label', { key: sp.id, className: 'inline-flex items-center gap-2 text-sm' },
            React.createElement('input', {
              type: 'checkbox',
              checked: selectedSpots.includes(sp.id),
              onChange: ()=>toggleSpot(sp.id)
            }),
            React.createElement('span', null, sp.name)
          ))
        )
      ),

      (loading ? React.createElement('div', { className: 'text-center py-16' }, 'Laden...') :
        spotsToShow().map(spot => {
          const arr = data[spot.id] || [];
          const aggregates = arr.map(day => computeDayAggregate(spot.id, day));
          return React.createElement('section', { key: spot.id, className: 'card p-4' },
            React.createElement('div', { className: 'flex items-center justify-between mb-3' },
              React.createElement('div', null,
                React.createElement('div', { className: 'text-lg font-medium' }, spot.name),
                React.createElement('div', { className: 'text-xs text-slate-500' }, spot.region)
              ),
              React.createElement('div', null,
                React.createElement('button', { className: 'px-3 py-1 text-sm rounded border' }, '7-daagse weergave')
              )
            ),

            // slider container - attach ref and draggable class
            React.createElement('div', {
              ref: el => { if (el) containerRefs.current[spot.id] = { current: el }; },
              className: 'overflow-x-auto h-scroll flex gap-4 py-2 -mx-2 px-2 draggable'
            },
              aggregates.map((ag, idx) => {
                const dayColor = mapScoreToColorObj(ag.score);
                return React.createElement('div', {
                  key: ag.date,
                  className: `min-w-[360px] h-item p-3 card ${dayColor.classDay}`,
                  style: { background: 'white' } // keep main card white
                },
                  React.createElement('div', { className: 'flex justify-between items-start mb-2' },
                    React.createElement('div', null,
                      React.createElement('div', { className: 'text-base font-semibold' }, new Date(ag.date).toLocaleDateString('nl-NL', { weekday: 'long' })),
                      React.createElement('div', { className: 'text-xs text-slate-500' }, new Date(ag.date).toLocaleDateString('nl-NL', { day: '2-digit', month: 'short' }))
                    ),
                    React.createElement('div', { className: 'flex items-center gap-2' },
                      ag.alert ? React.createElement('div', { className: 'alert-badge', style: { background: 'var(--accent)' }, title: 'Alert aanwezig' }, '⚠') : null
                    )
                  ),

                  // conclusion
                  React.createElement('div', { className: 'mb-3 text-sm text-slate-700' }, ag.summary),

                  // parts
                  React.createElement('div', { className: 'grid grid-cols-3 gap-3' },
                    ['morning','midday','evening'].map(part => {
                      const dayEntry = (data[spot.id] || []).find(d => d.date === ag.date) || {};
                      const p = dayEntry.parts ? (dayEntry.parts[part] || {}) : {};
                      const pc = ag.partsComputed[part] || {};
                      const scoreObj = mapScoreToColorObj(pc.score);
                      // determine wind display in km/h (if part provides kmh already use it)
                      const windKmh = (p.wind_kmh != null) ? Math.round(p.wind_kmh) : (p.wind_bft != null ? bftToKmh(p.wind_bft) : (ag.wind_bft != null ? bftToKmh(ag.wind_bft) : null));
                      return React.createElement('div', { key: part, className: `p-3 card ${scoreObj.classPart}` },
                        React.createElement('div', { className: 'mb-2' },
                          React.createElement('div', { className: 'text-sm font-semibold capitalize' }, part === 'midday' ? 'Middag' : part === 'morning' ? 'Ochtend' : 'Avond')
                        ),
                        React.createElement('div', { className: 'text-sm' },
                          React.createElement('div', null,
                            React.createElement('div', { className: 'text-xs text-slate-400' }, 'Golfhoogte'),
                            React.createElement('div', { className: 'font-semibold' }, (p.swell_m || ag.swell_m ? `${(p.swell_m || ag.swell_m).toFixed(1)} m` : '—'))
                          ),
                          React.createElement('div', { className: 'mt-2' },
                            React.createElement('div', { className: 'text-xs text-slate-400' }, 'Swell Periode'),
                            React.createElement('div', { className: 'font-semibold' }, (p.period_s || ag.period_s) ? `${p.period_s || ag.period_s}s` : '—')
                          ),
                          React.createElement('div', { className: 'mt-2' },
                            React.createElement('div', { className: 'text-xs text-slate-400 inline-block mr-2' }, 'Wind'),
                            React.createElement('div', { className: 'font-semibold inline-block' }, `${p.wind_dir || ag.wind_dir || '—'}${windKmh ? ` • ${windKmh} km/u` : ''}`)
                          )
                        )
                      );
                    })
                  )
                );
              })
            )
          );
        })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
  </script>
</body>
</html>
