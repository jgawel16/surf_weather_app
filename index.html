<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Surf Forecast — 7-daags</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- React + ReactDOM (UMD globals: React, ReactDOM) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root {
      --accent:#a56cc1; --surf-red:#ff5a5f; --surf-orange:#ffb400;
      --surf-green:#4cc29f; --surf-darkgreen:#1f8f6b;
    }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color:#000; background:#fff; margin:0; padding:0; overflow-x:hidden;
    }
    .h-scroll { scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; cursor:grab; }
    .h-item { scroll-snap-align:start; }
    .card { border:1px solid rgba(15,23,42,.06); background:#fff; border-radius:12px; }
    .alert-badge { width:18px; height:18px; border-radius:12px;
      display:inline-flex; align-items:center; justify-content:center;
      color:#fff; font-size:12px; }
    .q-red{ border-left:6px solid var(--surf-red) } .q-orange{ border-left:6px solid var(--surf-orange) }
    .q-green{ border-left:6px solid var(--surf-green) } .q-dark{ border-left:6px solid var(--surf-darkgreen) }
    .part-red{ background:rgba(255,90,95,.08); border-radius:8px }
    .part-orange{ background:rgba(255,180,0,.08); border-radius:8px }
    .part-green{ background:rgba(76,194,159,.08); border-radius:8px }
    .part-dark{ background:rgba(31,143,107,.08); border-radius:8px }
    .cursor-grabbing{ cursor:grabbing !important; cursor:-webkit-grabbing !important; }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>

  <!-- React app -->
  <script type="module" src="./react-app.js"></script>
</body>
</html>
