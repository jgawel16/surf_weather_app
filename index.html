<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Surf Forecast — 7-daags</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --accent: #a56cc1;
      --surf-red: #ff5a5f;
      --surf-orange: #ffb400;
      --surf-green: #4cc29f;
      --surf-darkgreen: #1f8f6b;
      --muted: #f6f8fb;
    }
    body {
      font-family: "GT America Standard", Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #000;
    }
    .h-scroll { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; cursor: grab; }
    .h-item { scroll-snap-align: start; }
    .card { border: 1px solid rgba(15,23,42,0.06); background: white; border-radius: 12px; }
    .alert-badge { width: 18px; height: 18px; border-radius: 12px; display:inline-flex; align-items:center; justify-content:center; color: white; font-size:12px; }
    .q-red    { border-left: 4px solid var(--surf-red); }
    .q-orange { border-left: 4px solid var(--surf-orange); }
    .q-green  { border-left: 4px solid var(--surf-green); }
    .q-dark   { border-left: 4px solid var(--surf-darkgreen); }
    .part-red    { background: rgba(255,90,95,0.08); }
    .part-orange { background: rgba(255,180,0,0.08); }
    .part-green  { background: rgba(76,194,159,0.08); }
    .part-dark   { background: rgba(31,143,107,0.08); }
    .swell-line { height: 8px; border-radius: 6px; background: linear-gradient(180deg, #e8f2fb, white); }
  </style>
</head>
<body class="bg-white min-h-screen">
  <div id="app" class="p-6 max-w-7xl mx-auto"></div>
  <script type="text/javascript">
    const { useState, useEffect, useRef } = React;

    /********** Helper Data **********/
    const SPOTS = [
      { id: 'schev', name: 'Scheveningen', region: 'Z-H', shoreBearing: 260 },
      { id: 'wijk', name: 'Wijk aan Zee', region: 'N-H', shoreBearing: 250 },
      { id: 'domburg', name: 'Domburg', region: 'Zeeland', shoreBearing: 230 },
    ];
    const COMPASS_TO_DEG = { 'N':0,'NO':45,'O':90,'ZO':135,'Z':180,'ZW':225,'W':270,'NW':315 };

    /********** Utilities **********/
    function degDiff(a,b){ let d=Math.abs(a-b)%360; return d>180?360-d:d; }
    function parseWindDirString(dir){ if(!dir) return null; const t=dir.split(/[\/\s,]+/)[0].toUpperCase(); return COMPASS_TO_DEG[t]??null; }
    function computeWindType(spot,windDir){ const deg=parseWindDirString(windDir); if(deg===null) return 'unknown'; const diff=degDiff(deg,spot.shoreBearing); if(diff<=45) return 'onshore'; if(Math.abs(diff-180)<=45) return 'offshore'; return 'crossshore'; }
    function bftToKmh(bft){ return Math.round(bft*1.87*10); }
    function mapScoreToColor(score){ if(score<=0) return {class:'q-red',part:'part-red',label:'slecht'}; if(score===1) return {class:'q-orange',part:'part-orange',label:'matig'}; if(score<=3) return {class:'q-green',part:'part-green',label:'goed'}; return {class:'q-dark',part:'part-dark',label:'top'}; }
    function computeScore({swell_m,period_s,wind_bft,wind_type}){ let s=0; if(swell_m>=1.2)s+=2; else if(swell_m>=0.6)s+=1; if(period_s>=9)s+=1; else if(period_s>=7)s+=0.5; if(wind_type==='offshore')s+=1; if(wind_type==='crossshore')s+=0.5; if(wind_type==='onshore'&&wind_bft>=4)s-=1; return Math.max(0,Math.min(4,Math.round(s))); }
    function buildConclusion(e){ if(!e) return ''; if(e.score>=4) return 'Top-condities, beste momenten bij hoogwater.'; if(e.score===3) return 'Goede surfmomenten vandaag, vooral rond tij-window.'; if(e.score===2) return 'Prima voor longboards of fish, minder ideaal voor shortboards.'; if(e.score===1) return 'Klein en rommelig; leuk voor beginners.'; return 'Te klein of rommelig om te surfen.'; }

    /********** Mock Data **********/
    function loadMockData(){
      const today=new Date();
      const days=[...Array(5)].map((_,i)=>{const d=new Date(today);d.setDate(today.getDate()+i);return d.toISOString().slice(0,10)});
      const data={};
      SPOTS.forEach(sp=>{ data[sp.id]=days.map((date,idx)=>({ date, spot:sp.id, alert:(idx===2&&sp.id==='schev'), parts:{ morning:{swell_m:0.5+idx*0.1,period_s:6+idx,wind_bft:2+idx%3,wind_dir:'ZW'}, midday:{swell_m:0.6+idx*0.1,period_s:7+idx,wind_bft:3+idx%3,wind_dir:'W'}, evening:{swell_m:0.7+idx*0.1,period_s:8+idx,wind_bft:2+idx%3,wind_dir:'NW'} } })); });
      return data;
    }

    /********** App **********/
    function App(){
      const [spots]=useState(SPOTS);
      const [data,setData]=useState({});
      const [selectedSpots,setSelectedSpots]=useState(()=>{try{return JSON.parse(localStorage.getItem('fav_spots')||'[]')}catch{return[]}});
      const [filterBest,setFilterBest]=useState(false);
      const sliderRef=useRef(null);

      useEffect(()=>{setData(loadMockData())},[]);
      useEffect(()=>{localStorage.setItem('fav_spots',JSON.stringify(selectedSpots))},[selectedSpots]);

      useEffect(()=>{ // drag scroll
        const slider=sliderRef.current; if(!slider) return;
        let isDown=false,startX,scrollLeft;
        const down=e=>{isDown=true;slider.classList.add('cursor-grabbing');startX=e.pageX-slider.offsetLeft;scrollLeft=slider.scrollLeft};
        const leave=()=>{isDown=false;slider.classList.remove('cursor-grabbing')};
        const up=()=>{isDown=false;slider.classList.remove('cursor-grabbing')};
        const move=e=>{if(!isDown)return;e.preventDefault();const x=e.pageX-slider.offsetLeft;const walk=(x-startX);slider.scrollLeft=scrollLeft-walk};
        slider.addEventListener('mousedown',down);
        slider.addEventListener('mouseleave',leave);
        slider.addEventListener('mouseup',up);
        slider.addEventListener('mousemove',move);
        return()=>{slider.removeEventListener('mousedown',down);slider.removeEventListener('mouseleave',leave);slider.removeEventListener('mouseup',up);slider.removeEventListener('mousemove',move)};
      },[]);

      function toggleSpot(id){setSelectedSpots(p=>p.includes(id)?p.filter(s=>s!==id):[...p,id])}
      function computeDayAgg(spotId,day){const parts=Object.values(day.parts);const swell=parts.reduce((a,p)=>a+p.swell_m,0)/3;const per=Math.round(parts.reduce((a,p)=>a+p.period_s,0)/3);const wind_bft=Math.round(parts.reduce((a,p)=>a+p.wind_bft,0)/3);const wind_dir=parts[1].wind_dir;const sp=spots.find(s=>s.id===spotId);const wind_type=computeWindType(sp,wind_dir);const score=computeScore({swell_m:swell,period_s:per,wind_bft,wind_type});return{...day,swell_m:swell,period_s:per,wind_bft,wind_dir,wind_type,score,summary:buildConclusion({swell_m:swell,period_s:per,wind_bft,wind_type,score})}};

      const spotsToShow=()=>{const all=selectedSpots.length?spots.filter(s=>selectedSpots.includes(s.id)):spots;if(!filterBest)return all;const today=new Date().toISOString().slice(0,10);let best=null,score=-1;all.forEach(sp=>{const e=data[sp.id]?.find(d=>d.date===today);if(!e)return;const ag=computeDayAgg(sp.id,e);if(ag.score>score){score=ag.score;best=sp}});return best?[best,...all.filter(s=>s.id!==best.id)]:all};

      return React.createElement('div',{className:'space-y-6'},
        // header
        React.createElement('header',{className:'flex flex-col sm:flex-row items-center justify-between gap-4'},
          React.createElement('div',{className:'flex items-center gap-4'},
            React.createElement('img',{src:'Ingezoomd logo.png',alt:'Logo',className:'w-12 h-16 object-contain'}),
            React.createElement('div',null,
              React.createElement('h1',{className:'text-2xl font-medium'},'Surf Forecast'),
              React.createElement('div',{className:'text-sm text-slate-600'},'AI gestuurde surfdata, recht op je beeldscherm!')
            )
          ),
          React.createElement('div',{className:'flex items-center gap-2'},
            React.createElement('label',{className:'text-sm text-slate-600'},'Toon beste spots'),
            React.createElement('input',{type:'checkbox',checked:filterBest,onChange:e=>setFilterBest(e.target.checked)})
          )
        ),
        // favorites
        React.createElement('section',{className:'card p-4'},
          React.createElement('div',{className:'mb-2 text-sm text-slate-700'},'Selecteer je favoriete spots:'),
          React.createElement('div',{className:'flex flex-wrap gap-3'},
            spots.map(sp=>React.createElement('label',{key:sp.id,className:'inline-flex items-center gap-2 text-sm'},
              React.createElement('input',{type:'checkbox',checked:selectedSpots.includes(sp.id),onChange:()=>toggleSpot(sp.id)}),
              React.createElement('span',null,sp.name)
            ))
          )
        ),
        // main
        spotsToShow().map(sp=>{
          const arr=data[sp.id]||[];
          const aggs=arr.map(day=>computeDayAgg(sp.id,day));
          return React.createElement('section',{key:sp.id,className:'card p-4'},
            React.createElement('div',{className:'flex justify-between mb-3'},
              React.createElement('div',null,
                React.createElement('div',{className:'text-lg font-medium'},sp.name),
                React.createElement('div',{className:'text-xs text-slate-500'},sp.region)
              )
            ),
            React.createElement('div',{ref:sliderRef,className:'overflow-x-auto h-scroll flex gap-4 py-2'},
              aggs.map(ag=>{
                const q=mapScoreToColor(ag.score);
                return React.createElement('div',{key:ag.date,className:`min-w-[320px] p-3 card ${q.class}`},
                  React.createElement('div',{className:'flex justify-between items-start mb-2'},
                    React.createElement('div',null,
                      React.createElement('div',{className:'font-semibold'},new Date(ag.date).toLocaleDateString('nl-NL',{weekday:'long'})),
                      React.createElement('div',{className:'text-xs text-slate-500'},new Date(ag.date).toLocaleDateString('nl-NL',{day:'2-digit',month:'short'}))
                    ),
                    ag.alert?React.createElement('div',{className:'alert-badge',style:{background:'var(--accent)'}},'⚠'):null
                  ),
                  React.createElement('div',{className:'mb-3 text-sm'},ag.summary),
                  React.createElement('div',{className:'grid grid-cols-3 gap-3'},
                    ['morning','midday','evening'].map(part=>{
                      const p=(arr.find(d=>d.date===ag.date)||{}).parts?.[part]||{};
                      const wt=computeWindType(sp,p.wind_dir||ag.wind_dir);
                      const s=computeScore({swell_m:p.swell_m||ag.swell_m,period_s:p.period_s||ag.period_s,wind_bft:p.wind_bft||ag.wind_bft,wind_type:wt});
                      const qc=mapScoreToColor(s);
                      return React.createElement('div',{key:part,className:`p-2 rounded ${qc.part}`},
                        React.createElement('div',{className:'text-sm font-semibold capitalize'},part==='morning'?'Ochtend':part==='midday'?'Middag':'Avond'),
                        React.createElement('div',{className:'text-xs'},`Golfhoogte: ${(p.swell_m||ag.swell_m).toFixed(1)} m`),
                        React.createElement('div',{className:'text-xs'},`Periode: ${p.period_s||ag.period_s}s`),
                        React.createElement('div',{className:'text-xs'},`Wind: ${p.wind_dir||ag.wind_dir} • ${bftToKmh(p.wind_bft||ag.wind_bft)} km/u`),
                        React.createElement('div',{className:'text-xs'},`Type: ${wt}`),
                        React.createElement('div',{className:'text-xs'},`Getij: —`)
                      )
                    })
                  )
                )
              })
            )
          )
        })
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
  </script>
</body>
</html>
