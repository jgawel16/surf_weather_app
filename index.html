<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Surf Forecast — 7-daags</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    :root{
      --accent: #a56cc1;
      --surf-red: #ff5a5f;
      --surf-orange: #ffb400;
      --surf-green: #4cc29f;
      --surf-darkgreen: #1f8f6b;
    }
    body { font-family: "GT America Standard", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; color: #000; }
    .h-scroll { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .h-item { scroll-snap-align: start; }
    .card { border: 1px solid rgba(15,23,42,0.06); background: white; border-radius: 12px; }
    .alert-badge { width: 18px; height: 18px; border-radius: 12px; display:inline-flex; align-items:center; justify-content:center; color: white; font-size:12px; }
    /* kleur alleen als rand */
    .day-red { border-left: 4px solid var(--surf-red); }
    .day-orange { border-left: 4px solid var(--surf-orange); }
    .day-green { border-left: 4px solid var(--surf-green); }
    .day-dark { border-left: 4px solid var(--surf-darkgreen); }
    /* kleur als achtergrond */
    .part-red { background: rgba(255,90,95,0.06); }
    .part-orange { background: rgba(255,180,0,0.08); }
    .part-green { background: rgba(76,194,159,0.08); }
    .part-dark { background: rgba(31,143,107,0.08); }
  </style>
</head>
<body class="bg-white min-h-screen">
  <div id="app" class="p-6 max-w-7xl mx-auto"></div>

  <script type="text/javascript">
  const { useState, useEffect } = React;

  const SPOTS = [
    { id: 'schev', name: 'Scheveningen', region: 'Z-H', shoreBearing: 260 },
    { id: 'wijk', name: 'Wijk aan Zee', region: 'N-H', shoreBearing: 250 },
    { id: 'domburg', name: 'Domburg', region: 'Zeeland', shoreBearing: 230 }
  ];

  const COMPASS_TO_DEG = { 'N':0,'NO':45,'O':90,'ZO':135,'Z':180,'ZW':225,'W':270,'NW':315 };

  function degDiff(a,b){ let d=Math.abs(a-b)%360; if(d>180) d=360-d; return d; }
  function parseWindDir(dir){ return COMPASS_TO_DEG[dir] ?? null; }

  function computeWindType(spot, windDir){
    const deg = parseWindDir(windDir);
    if(deg===null) return 'unknown';
    const diff = degDiff(deg, spot.shoreBearing);
    if(diff<=45) return 'onshore';
    if(Math.abs(diff-180)<=45) return 'offshore';
    return 'crossshore';
  }

  function bftToKmh(bft){ return Math.round(Math.pow(bft/0.836, 2/3)); }

  function computeScore({swell_m,period_s,wind_bft,wind_type}){
    let s=0;
    if(swell_m>=1.2) s+=2; else if(swell_m>=0.6) s+=1;
    if(period_s>=9) s+=1; else if(period_s>=7) s+=0.5;
    if(wind_type==='offshore') s+=1; if(wind_type==='crossshore') s+=0.5;
    if(wind_type==='onshore' && wind_bft>=4) s-=1;
    return Math.max(0,Math.min(4,Math.round(s)));
  }

  function mapScoreToClass(score,mode){
    if(score<=0) return mode==='day'?'day-red':'part-red';
    if(score===1) return mode==='day'?'day-orange':'part-orange';
    if(score===2||score===3) return mode==='day'?'day-green':'part-green';
    return mode==='day'?'day-dark':'part-dark';
  }

  function buildConclusion(entry){
    if(entry.score>=4) return 'Top condities — ga surfen!';
    if(entry.score===3) return 'Goede surfmomenten vandaag.';
    if(entry.score===2) return 'Redelijk, vooral geschikt voor longboards.';
    if(entry.score===1) return 'Klein en rommelig, meer voor beginners.';
    return 'Geen surfbare condities.';
  }

  function loadMockData(){
    const today = new Date();
    const days = [...Array(7)].map((_,i)=>{ let d=new Date(today); d.setDate(today.getDate()+i); return d.toISOString().slice(0,10); });
    const data={};
    SPOTS.forEach(spot=>{
      data[spot.id]=days.map((date,idx)=>{
        const swell=[0.4,0.6,0.9,1.3,1.0,0.7,0.5][idx];
        const period=[6,7,8,10,9,7,6][idx];
        const wind_bft=[2,3,4,5,3,2,1][idx];
        const wind_dir=['ZW','W','NW','NO','O','ZO','Z'][idx];
        return {
          date,
          parts:{
            morning:{swell_m:swell*0.9,period_s:period-1,wind_bft:wind_bft-1,wind_dir},
            midday:{swell_m:swell,period_s:period,wind_bft,wind_dir},
            evening:{swell_m:swell*1.1,period_s:period+1,wind_bft:wind_bft+1,wind_dir}
          }
        };
      });
    });
    return data;
  }

  function App(){
    const [data,setData]=useState({});
    useEffect(()=>{ setData(loadMockData()); },[]);

    return React.createElement('div',{className:'space-y-6'},
      React.createElement('header',{className:'flex items-center justify-between'},
        React.createElement('div',{className:'flex items-center gap-4'},
          React.createElement('h1',{className:'text-2xl font-medium'},'Surf Forecast'),
          React.createElement('div',{className:'text-sm text-slate-600'},'AI gestuurde surfdata, recht op je beeldscherm!')
        )
      ),
      SPOTS.map(spot=>{
        const arr=data[spot.id]||[];
        return React.createElement('section',{key:spot.id,className:'card p-4'},
          React.createElement('div',{className:'mb-3'},
            React.createElement('div',{className:'text-lg font-medium'},spot.name),
            React.createElement('div',{className:'text-xs text-slate-500'},spot.region)
          ),
          React.createElement('div',{className:'overflow-x-auto h-scroll flex gap-4 py-2'},
            arr.map(day=>{
              const parts=Object.entries(day.parts);
              const avg=parts.reduce((acc,[k,v])=>acc+computeScore({...v,wind_type:computeWindType(spot,v.wind_dir)}),0)/parts.length;
              const dayClass=mapScoreToClass(Math.round(avg),'day');
              return React.createElement('div',{key:day.date,className:`min-w-[360px] h-item p-3 card ${dayClass}`},
                React.createElement('div',{className:'flex justify-between items-start mb-2'},
                  React.createElement('div',null,
                    React.createElement('div',{className:'text-base font-semibold'},new Date(day.date).toLocaleDateString('nl-NL',{weekday:'long'})),
                    React.createElement('div',{className:'text-xs text-slate-500'},new Date(day.date).toLocaleDateString('nl-NL',{day:'2-digit',month:'short'}))
                  )
                ),
                React.createElement('div',{className:'mb-3 text-sm text-slate-700'},buildConclusion({score:Math.round(avg)})),
                React.createElement('div',{className:'grid grid-cols-3 gap-3'},
                  parts.map(([part,v])=>{
                    const windType=computeWindType(spot,v.wind_dir);
                    const score=computeScore({...v,wind_type:windType});
                    const pClass=mapScoreToClass(score,'part');
                    return React.createElement('div',{key:part,className:`p-3 card ${pClass}`},
                      React.createElement('div',{className:'text-sm font-semibold capitalize'},part==='morning'?'Ochtend':part==='midday'?'Middag':'Avond'),
                      React.createElement('div',{className:'mt-2 text-xs text-slate-400'},'Golfhoogte'),
                      React.createElement('div',{className:'font-semibold'},`${v.swell_m.toFixed(1)} m`),
                      React.createElement('div',{className:'mt-2 text-xs text-slate-400'},'Swell Periode'),
                      React.createElement('div',{className:'font-semibold'},`${v.period_s}s`),
                      React.createElement('div',{className:'mt-2 text-xs text-slate-400'},'Wind'),
                      React.createElement('div',{className:'font-semibold'},`${v.wind_dir} • ${bftToKmh(v.wind_bft)} km/u`)
                    );
                  })
                )
              );
            })
          )
        );
      })
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
  </script>
</body>
</html>
